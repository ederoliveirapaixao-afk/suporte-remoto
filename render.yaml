services:
  - type: web
    name: suporte-remoto
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: starter
    healthCheckPath: /api/ice-servers
    envVars:
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: TURN_HOST
        sync: false
      - key: TURN_USER
        sync: false
      - key: TURN_PASS
        sync: false
